# Demo 的 443 端點。憑證由具名 volume typeai-demo_nginx-certs 提供。
#
# 這裡沒有 upstream：應用本體部署不在本 spec（ADR-0003）。
# WebSocket 的透明性來自 Edge 做的是 L4 DNAT —— Edge 不解析 HTTP，
# TLS 在這裡才終結。那是 entrance port 的性質，不是這份設定的性質。

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 回應帶 env=demo，讓同一個位址上的 8081（UAT）與 8082（Demo）可區分。
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","env":"demo"}';
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
